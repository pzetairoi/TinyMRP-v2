# One-folder TinyMRP container setup (Phase 2 hardened):
# - Provide only TINYMRP_DELIVERABLES_DIR (host path).
# - Persist MongoDB + runtime secrets under <deliverables>/.tinymrp/
#
# Windows note: use forward slashes (e.g. C:/CADEXPORT/Deliverables).
# The PowerShell helper generates first-admin credentials operator-side and writes
# them to its compose env file; the container never generates or logs them.

services:
  mongo:
    image: ${TINYMRP_MONGO_IMAGE:-mongo:6.0@sha256:8b6d8f5bbedb25cb73517b65cf99f13aeb75ad5b157a56c479287a840bbad3ac}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      MONGO_INITDB_DATABASE: tinymrp-v2
    volumes:
      - type: bind
        source: ${TINYMRP_DELIVERABLES_DIR:?Set TINYMRP_DELIVERABLES_DIR (host deliverables folder, e.g. C:/CADEXPORT/Deliverables)}/.tinymrp/mongo
        target: /data/db
    healthcheck:
      # mongosh is a full Node REPL, not a light client: one invocation
      # measured at 1873 ms of CPU and five new connections. At the old 10s
      # interval that is roughly 23 seconds of CPU per minute per Mongo, on an
      # idle host - a large share of the "40% CPU while idle" the owner saw,
      # spent entirely on asking whether the database was alive.
      # 30s still notices a dead Mongo quickly enough for a healthcheck whose
      # retries then take another 90s to act.
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 30s
      timeout: 10s
      retries: 5

  app:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      FLASK_ENV: production
      # Secrets are REQUIRED and are never generated by the application: a key
      # invented at boot changes on restart, and an app that re-keys itself
      # cannot tell a forged session from a real one.
      # tools/run-tinymrp-container.ps1 generates and stores both.
      SECRET_KEY: ${SECRET_KEY:?Run tools/run-tinymrp-container.ps1, or set SECRET_KEY to a 32+ character random value}
      SECURITY_PASSWORD_SALT: ${SECURITY_PASSWORD_SALT:?Run tools/run-tinymrp-container.ps1, or set SECURITY_PASSWORD_SALT to a different 32+ character random value}
      # This helper publishes plain HTTP. The scheme in TINYMRP_URL is what
      # keeps session cookies storable on a plain-HTTP origin and stops the CSP
      # upgrading page assets to https, so it must match how the browser
      # actually reaches the stack.
      TINYMRP_URL: ${TINYMRP_URL:-http://localhost:5000}
      # nginx below is the single proxy in front of the app.
      TINYMRP_TRUSTED_PROXY_HOPS: "1"
      API_TOKEN_DEFAULT_TTL_DAYS: ${API_TOKEN_DEFAULT_TTL_DAYS:-90}
      API_TOKEN_MAX_TTL_DAYS: ${API_TOKEN_MAX_TTL_DAYS:-365}
      MONGO_URI: mongodb://mongo:27017/tinymrp-v2
      # Unified files configuration
      FILES_LOCAL_ROOT: /data/deliverables
      FILES_URL_PREFIX: /deliverables
      FILES_PUBLIC_URLS: "false"
      # Leave accel redirect empty unless you intentionally provision and test
      # an Nginx internal route that matches the chosen prefix.
      FILES_ACCEL_REDIRECT_PREFIX: ""
      # Admin bootstrap is opt-in and requires both explicit credentials.
      TINYMRP_SEED_ADMIN: ${TINYMRP_SEED_ADMIN:-false}
      # NOTE: Must be a syntactically valid, deliverable-looking email for email_validator.
      # The helper defaults this to admin@example.com; direct users should set a
      # real operator-controlled address.
      TINYMRP_ADMIN_EMAIL: ${TINYMRP_ADMIN_EMAIL:-}
      TINYMRP_ADMIN_PASSWORD: ${TINYMRP_ADMIN_PASSWORD:-}
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - type: bind
        source: ${TINYMRP_DELIVERABLES_DIR:?Set TINYMRP_DELIVERABLES_DIR (host deliverables folder, e.g. C:/CADEXPORT/Deliverables)}
        target: /data/deliverables
      # Writable instance/ directory. It no longer holds generated secrets -
      # those are supplied above - but the app still writes CSV exports and
      # other one-off files here, and the rest of the image is read-only.
      - type: bind
        source: ${TINYMRP_DELIVERABLES_DIR:?Set TINYMRP_DELIVERABLES_DIR (host deliverables folder, e.g. C:/CADEXPORT/Deliverables)}/.tinymrp/instance
        target: /app/instance
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/ready', timeout=4).read()"]
      interval: 15s
      timeout: 5s
      retries: 10

  nginx:
    image: ${TINYMRP_NGINX_IMAGE:-nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "${HTTP_PORT:-5000}:80"
    depends_on:
      app:
        condition: service_healthy
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - type: bind
        source: ${TINYMRP_DELIVERABLES_DIR:?Set TINYMRP_DELIVERABLES_DIR (host deliverables folder, e.g. C:/CADEXPORT/Deliverables)}
        target: /data/deliverables
        read_only: true
