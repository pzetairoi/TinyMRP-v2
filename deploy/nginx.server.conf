server {
    listen 80;
    server_name _;

    # Proxy Flask (Gunicorn) running on localhost:8000
    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection "";
        proxy_read_timeout 300;
    }

    # internal files for X-Accel-Redirect
    location ^~ /__files/ {
        internal;
        alias /srv/tinymrp/deliverables/;
        add_header Cache-Control "private, max-age=3600";
    }

    # Authorisation subrequest for the two static locations below.
    #
    # auth_request takes a FIXED uri - nginx does not expand variables in it -
    # so "auth_request /files/auth?path=$request_uri" sent the literal text
    # "$request_uri" and every file came back 403. The path travels as a
    # header instead, which is what /files/auth reads first.
    location = /files/auth {
        internal;
        proxy_pass              http://127.0.0.1:8000/files/auth;
        proxy_pass_request_body off;
        proxy_set_header        Content-Length "";
        proxy_set_header        Host $host;
        proxy_set_header        X-Original-URI $request_uri;
        proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header        X-Forwarded-Proto $scheme;
    }

    # These only matter when FILES_PUBLIC_URLS=true. With the default (false)
    # every managed file is fetched through the app as /files/view/<token>.
    location ^~ /Deliverables/ {
        auth_request /files/auth;
        alias /srv/tinymrp/deliverables/;
        autoindex off;
        add_header Cache-Control "private, max-age=3600";
    }
    location ^~ /deliverables/ {
        auth_request /files/auth;
        alias /srv/tinymrp/deliverables/;
        autoindex off;
        add_header Cache-Control "private, max-age=3600";
    }

    location ~* \.(png|jpg|jpeg|pdf|dxf|step|stp|eprt|easm|edrw|3mf)$ {
        expires 7d;
        access_log off;
    }
}
