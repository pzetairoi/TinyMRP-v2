server {
    listen 80;
    server_name _;

    # Proxy Flask (Gunicorn) running on localhost:8000
    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection "";
        proxy_read_timeout 300;
    }

    # internal files for X-Accel-Redirect
    location ^~ /__files/ {
        internal;
        alias /srv/tinymrp/deliverables/;
        add_header Cache-Control "private, max-age=3600";
    }

    # deliverables protected via auth_request (both cases)
    location ^~ /Deliverables/ {
        auth_request /files/auth?path=$request_uri;
        alias /srv/tinymrp/deliverables/;
        autoindex off;
        add_header Cache-Control "private, max-age=3600";
    }
    location ^~ /deliverables/ {
        auth_request /files/auth?path=$request_uri;
        alias /srv/tinymrp/deliverables/;
        autoindex off;
        add_header Cache-Control "private, max-age=3600";
    }

    location ~* \.(png|jpg|jpeg|pdf|dxf|step|stp|eprt|easm|edrw|3mf)$ {
        expires 7d;
        access_log off;
    }
}
