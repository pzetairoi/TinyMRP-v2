server {
    listen 80;
    server_name _;

    # Proxy Flask (Gunicorn) running on localhost:8000
    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection "";
        proxy_read_timeout 300;
    }

    # Static Deliverables (both cases)
    location ^~ /Deliverables/ {
        # CORS headers so frontend from another origin can fetch files
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, HEAD, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Range, DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type' always;
            add_header 'Access-Control-Max-Age' 86400 always;
            return 204;
        }
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Expose-Headers' 'Content-Range, Accept-Ranges, Content-Length, Content-Type' always;
        add_header 'Timing-Allow-Origin' '*' always;
        alias /srv/tinymrp/deliverables/;
        autoindex on;
        add_header Cache-Control "public, max-age=3600";
    }
    location ^~ /deliverables/ {
        # CORS headers so frontend from another origin can fetch files
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, HEAD, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Range, DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type' always;
            add_header 'Access-Control-Max-Age' 86400 always;
            return 204;
        }
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Expose-Headers' 'Content-Range, Accept-Ranges, Content-Length, Content-Type' always;
        add_header 'Timing-Allow-Origin' '*' always;
        alias /srv/tinymrp/deliverables/;
        autoindex on;
        add_header Cache-Control "public, max-age=3600";
    }

    location ~* \.(png|jpg|jpeg|pdf|dxf|step|stp|eprt|easm|edrw|3mf)$ {
        expires 7d;
        access_log off;
    }
}
