worker_processes 1;

events {
    worker_connections 2048;
}

http {
    include mime.types;
    default_type application/octet-stream;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;
    client_max_body_size 1024m;

    # Simple per-client limiter to soften burst traffic.
    limit_req_zone $binary_remote_addr zone=tinymrp_per_ip:10m rate=15r/s;

    upstream tinymrp_app {
        server 127.0.0.1:8000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name tinymrp-lan.company.local;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;

        location = /healthz {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }

        location / {
            limit_req zone=tinymrp_per_ip burst=60 nodelay;
            proxy_pass http://tinymrp_app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_read_timeout 300;
        }

        # X-Accel internal path; never directly accessible by clients.
        location ^~ /__files/ {
            internal;
            alias C:/TinyMRP/data/deliverables/;
            add_header Cache-Control "private, max-age=3600";
        }

        # Protect deliverables with TinyMRP auth endpoint.
        location ^~ /Deliverables/ {
            auth_request /files/auth?path=$request_uri;
            alias C:/TinyMRP/data/deliverables/;
            autoindex off;
            add_header Cache-Control "private, max-age=3600";
        }

        location ^~ /deliverables/ {
            auth_request /files/auth?path=$request_uri;
            alias C:/TinyMRP/data/deliverables/;
            autoindex off;
            add_header Cache-Control "private, max-age=3600";
        }
    }
}
