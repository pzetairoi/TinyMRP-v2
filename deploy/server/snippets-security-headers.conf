# TinyMRP — security headers snippet.
# Install to: /etc/nginx/snippets/tinymrp-headers.conf
#
# NOTE (nginx behavior): any add_header inside a location REPLACES all inherited
# add_header directives — that is why this snippet is include'd again in every
# location that sets its own headers (e.g. Cache-Control on deliverables).
# The application itself sets CSP and the other app-level headers; nginx adds
# the transport-level ones so they also cover statically served files.

add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
