# TinyMRP — http{}-context settings (rate-limit zones, gzip).
# Install to: /etc/nginx/conf.d/tinymrp-http.conf
# (limit_req_zone directives are only valid in the http{} context.)

# Rate-limit zones. The app also rate-limits internally (Flask-Limiter);
# these provide a cheaper first line at the edge.
limit_req_zone $binary_remote_addr zone=tinymrp_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=tinymrp_api:10m   rate=20r/s;
limit_req_status 429;

# Compress text assets (never pre-compressed binaries).
gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_proxied any;
gzip_vary on;
gzip_types
    text/plain text/css text/xml application/json application/javascript
    application/xml image/svg+xml font/ttf font/otf application/wasm;
