# TinyMRP — hardened TLS site (standalone Linux server, tier T2).
# Install to: /etc/nginx/sites-available/tinymrp  (symlink into sites-enabled)
#
# Placeholders replaced by install-server.sh (or by hand):
#   __SERVER_NAME__        e.g. mrp.example.com
#   __DELIVERABLES_DIR__   e.g. /srv/tinymrp/deliverables
#   __CERT_FULLCHAIN__     e.g. /etc/letsencrypt/live/mrp.example.com/fullchain.pem
#   __CERT_KEY__           e.g. /etc/letsencrypt/live/mrp.example.com/privkey.pem
#
# Certificate options:
#   - Public host:   certbot --nginx -d <domain>   (paths above are the certbot layout)
#   - Internal CA:   point __CERT_FULLCHAIN__/__CERT_KEY__ at certificates issued by
#     your corporate CA; OCSP stapling below only applies when the CA publishes OCSP.
#
# Requires /etc/nginx/conf.d/tinymrp-http.conf (rate-limit zones, gzip) and
# /etc/nginx/snippets/tinymrp-headers.conf — both shipped in deploy/server/.

# HTTP: redirect everything to HTTPS (keep ACME webroot reachable for renewals)
server {
    listen 80;
    listen [::]:80;
    server_name __SERVER_NAME__;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # 'listen ... http2' works on distro nginx (1.18/1.24). On nginx >= 1.25.1
    # you may switch to the newer 'http2 on;' directive instead.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __SERVER_NAME__;

    # --- TLS (Mozilla "intermediate" profile) ---
    ssl_certificate     __CERT_FULLCHAIN__;
    ssl_certificate_key __CERT_KEY__;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:TinyMRP_SSL:10m;
    ssl_session_tickets off;
    # OCSP stapling (public CAs; harmless no-op for most internal CAs)
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 127.0.0.53 valid=300s ipv6=off;
    resolver_timeout 5s;

    include snippets/tinymrp-headers.conf;

    # Align with the app's upload caps (UPLOAD_PACK_MAX_ZIP_MB, default 1024)
    client_max_body_size 1g;
    client_body_timeout 120s;

    # Do not leak version info
    server_tokens off;

    # --- Auth endpoints: strict edge rate limit (app also limits internally) ---
    location = /login {
        limit_req zone=tinymrp_login burst=10 nodelay;
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection "";
    }

    # --- API: generous shared budget at the edge ---
    location /api/ {
        limit_req zone=tinymrp_api burst=40 nodelay;
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection "";
        proxy_read_timeout 300;
    }

    # --- App (Gunicorn on localhost) ---
    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection "";
        proxy_read_timeout 300;
    }

    # --- Internal files for X-Accel-Redirect ---
    location ^~ /__files/ {
        internal;
        alias __DELIVERABLES_DIR__/;
        include snippets/tinymrp-headers.conf;
        add_header Cache-Control "private, max-age=3600";
    }

    # --- Deliverables protected via auth_request (both capitalizations) ---
    location ^~ /Deliverables/ {
        auth_request /files/auth?path=$request_uri;
        alias __DELIVERABLES_DIR__/;
        autoindex off;
        include snippets/tinymrp-headers.conf;
        add_header Cache-Control "private, max-age=3600";
    }
    location ^~ /deliverables/ {
        auth_request /files/auth?path=$request_uri;
        alias __DELIVERABLES_DIR__/;
        autoindex off;
        include snippets/tinymrp-headers.conf;
        add_header Cache-Control "private, max-age=3600";
    }

    # --- Static assets: long cache ---
    location /static/ {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   Connection "";
        include snippets/tinymrp-headers.conf;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
    }
}
