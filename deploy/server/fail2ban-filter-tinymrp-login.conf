# fail2ban filter — TinyMRP login abuse via the nginx access log.
# Install to: /etc/fail2ban/filter.d/tinymrp-login.conf
#
# Matches POST /login attempts that ended in 401/403/429 (the app rate limiter
# answers 429; failed form logins bounce with 200+re-render, so the reliable
# ban signal is the edge/app rate-limit response and outright denials).

[Definition]
failregex = ^<HOST> \S+ \S+ \[[^\]]+\] "POST /login[^"]*" (401|403|429)
ignoreregex =
