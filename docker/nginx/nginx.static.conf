worker_processes  auto;

events { worker_connections  1024; }

http {
  include       mime.types;
  default_type  application/octet-stream;
  sendfile      on;

  server {
    listen 80;

    # Static deliverables are disabled here to avoid public exposure.
    location ^~ /Deliverables/ {
      return 403;
    }
    location ^~ /deliverables/ {
      return 403;
    }

    location / {
      return 200 "TinyMRP static file server - /Deliverables available\n";
      add_header Content-Type text/plain;
    }
  }
}
