worker_processes  auto;

events { worker_connections  1024; }

http {
  include       mime.types;
  default_type  application/octet-stream;
  sendfile      on;

  server {
    listen 80;

    # Only serve static deliverables (useful for local Flask dev)
    location ^~ /Deliverables/ {
      # CORS for cross-origin fetches from the app during local dev
      if ($request_method = 'OPTIONS') {
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, HEAD, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Range, DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type' always;
        add_header 'Access-Control-Max-Age' 86400 always;
        return 204;
      }
      add_header 'Access-Control-Allow-Origin' '*' always;
      add_header 'Access-Control-Expose-Headers' 'Content-Range, Accept-Ranges, Content-Length, Content-Type' always;
      add_header 'Timing-Allow-Origin' '*' always;
      alias /data/deliverables/;
      autoindex on;
      add_header Cache-Control "public, max-age=3600";
    }
    location ^~ /deliverables/ {
      # CORS for cross-origin fetches from the app during local dev
      if ($request_method = 'OPTIONS') {
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, HEAD, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Range, DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type' always;
        add_header 'Access-Control-Max-Age' 86400 always;
        return 204;
      }
      add_header 'Access-Control-Allow-Origin' '*' always;
      add_header 'Access-Control-Expose-Headers' 'Content-Range, Accept-Ranges, Content-Length, Content-Type' always;
      add_header 'Timing-Allow-Origin' '*' always;
      alias /data/deliverables/;
      autoindex on;
      add_header Cache-Control "public, max-age=3600";
    }

    location / {
      return 200 "TinyMRP static file server - /Deliverables available\n";
      add_header Content-Type text/plain;
    }
  }
}
