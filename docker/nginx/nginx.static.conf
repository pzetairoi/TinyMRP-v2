worker_processes  auto;

events { worker_connections  1024; }

http {
  include       mime.types;
  default_type  application/octet-stream;
  sendfile      on;

  server {
    listen 80;

    # Only serve static deliverables (useful for local Flask dev)
    location ^~ /Deliverables/ {
      alias /data/deliverables/;
      autoindex on;
      add_header Cache-Control "public, max-age=3600";
    }
    location ^~ /deliverables/ {
      alias /data/deliverables/;
      autoindex on;
      add_header Cache-Control "public, max-age=3600";
    }

    location / {
      return 200 "TinyMRP static file server - /Deliverables available\n";
      add_header Content-Type text/plain;
    }
  }
}

