worker_processes  auto;

events { worker_connections  1024; }

http {
  include       mime.types;
  default_type  application/octet-stream;
  sendfile      on;

  # Point upstream to local Flask (python run.py)
  upstream tinymrp_app {
    server host.docker.internal:5000;  # Flask dev server on host
  }

  server {
    listen 80;

    # Proxy all app requests to local Flask
    location / {
      proxy_pass         http://tinymrp_app;
      proxy_http_version 1.1;
      proxy_set_header   Host $host;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_set_header   Connection "";
      proxy_read_timeout 300;
    }

    # Static deliverables (both cases)
    location ^~ /Deliverables/ {
      alias /data/deliverables/;
      autoindex on;
      add_header Cache-Control "public, max-age=3600";
    }
    location ^~ /deliverables/ {
      alias /data/deliverables/;
      autoindex on;
      add_header Cache-Control "public, max-age=3600";
    }

    # Cache headers for large assets
    location ~* \.(png|jpg|jpeg|pdf|dxf|step|stp|eprt|easm|edrw|3mf)$ {
      expires 7d;
      access_log off;
    }
  }
}

