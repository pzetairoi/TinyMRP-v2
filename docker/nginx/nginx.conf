worker_processes  auto;

events { worker_connections  1024; }

http {
  include       mime.types;
  default_type  application/octet-stream;
  sendfile      on;

  upstream tinymrp_app {
    server app:8000;   # container name + port
  }

  server {
    listen 80;

    # app (Flask/Gunicorn)
    location / {
      proxy_pass         http://tinymrp_app;
      proxy_http_version 1.1;
      proxy_set_header   Host $host;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_set_header   Connection "";
      proxy_read_timeout 300;
    }

    # internal files for X-Accel-Redirect
    location ^~ /__files/ {
      internal;
      alias /data/deliverables/;
      add_header Cache-Control "private, max-age=3600";
    }

    # Authorisation subrequest for the static deliverables locations below.
    #
    # The auth_request DIRECTIVE takes a fixed URI: nginx does not expand
    # variables there, so the previous "auth_request /files/auth?path=$request_uri"
    # sent the literal text "$request_uri" and the app answered 403 for every
    # file. The requested path has to travel as a header instead, which is what
    # /files/auth reads first (X-Original-URI).
    location = /files/auth {
      internal;
      proxy_pass              http://tinymrp_app/files/auth;
      proxy_pass_request_body off;
      proxy_set_header        Content-Length "";
      proxy_set_header        Host $host;
      proxy_set_header        X-Original-URI $request_uri;
      proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header        X-Forwarded-Proto $scheme;
    }

    # These only matter when FILES_PUBLIC_URLS=true. With the default (false)
    # every managed file is fetched through the application as
    # /files/view/<token>, and nothing ever requests these paths.
    location ^~ /deliverables/ {
      auth_request /files/auth;
      alias /data/deliverables/;
      autoindex off;
      add_header Cache-Control "private, max-age=3600";
    }

    location ^~ /Deliverables/ {
      auth_request /files/auth;
      alias /data/deliverables/;
      autoindex off;
      add_header Cache-Control "private, max-age=3600";
    }

    # (optional) cache headers for big files
    location ~* \.(png|jpg|jpeg|pdf|dxf|step|stp|eprt|easm|edrw|3mf|ply|stl)$ {
      expires 7d;
      access_log off;
    }
  }
}
