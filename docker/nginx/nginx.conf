worker_processes  auto;

events { worker_connections  1024; }

http {
  include       mime.types;
  default_type  application/octet-stream;
  sendfile      on;

  upstream tinymrp_app {
    server app:8000;   # container name + port
  }

  server {
    listen 80;

    # app (Flask/Gunicorn)
    location / {
      proxy_pass         http://tinymrp_app;
      proxy_http_version 1.1;
      proxy_set_header   Host $host;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_set_header   Connection "";
      proxy_read_timeout 300;
    }

    # static file server for deliverables (lowercase)
    location ^~ /deliverables/ {
      # CORS for cross-origin access (e.g., dev tooling)
      if ($request_method = 'OPTIONS') {
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, HEAD, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Range, DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type' always;
        add_header 'Access-Control-Max-Age' 86400 always;
        return 204;
      }
      add_header 'Access-Control-Allow-Origin' '*' always;
      add_header 'Access-Control-Expose-Headers' 'Content-Range, Accept-Ranges, Content-Length, Content-Type' always;
      add_header 'Timing-Allow-Origin' '*' always;
      alias /data/deliverables/;
      autoindex on;
      add_header Cache-Control "public, max-age=3600";
      # With alias, try_files against $uri can produce wrong paths; let alias serve directly
    }

    # static file server for Deliverables (uppercase) to match app defaults
    location ^~ /Deliverables/ {
      # CORS for cross-origin access (e.g., dev tooling)
      if ($request_method = 'OPTIONS') {
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, HEAD, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Range, DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type' always;
        add_header 'Access-Control-Max-Age' 86400 always;
        return 204;
      }
      add_header 'Access-Control-Allow-Origin' '*' always;
      add_header 'Access-Control-Expose-Headers' 'Content-Range, Accept-Ranges, Content-Length, Content-Type' always;
      add_header 'Timing-Allow-Origin' '*' always;
      alias /data/deliverables/;
      autoindex on;
      add_header Cache-Control "public, max-age=3600";
    }

    # (optional) cache headers for big files
    location ~* \.(png|jpg|jpeg|pdf|dxf|step|stp|eprt|easm|edrw|3mf)$ {
      expires 7d;
      access_log off;
    }
  }
}
