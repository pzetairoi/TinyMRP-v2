worker_processes  auto;

events { worker_connections  1024; }

http {
  include       mime.types;
  default_type  application/octet-stream;
  sendfile      on;

  upstream tinymrp_app {
    server app:8000;   # container name + port
  }

  server {
    listen 80;

    # app (Flask/Gunicorn)
    location / {
      proxy_pass         http://tinymrp_app;
      proxy_http_version 1.1;
      proxy_set_header   Host $host;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_set_header   Connection "";
      proxy_read_timeout 300;
    }

    # static file server for deliverables
    location /Deliverables/ {
      alias /data/deliverables/;
      autoindex on;
      add_header Cache-Control "public, max-age=3600";
      try_files $uri =404;
    }

    # (optional) cache headers for big files
    location ~* \.(png|jpg|jpeg|pdf|dxf|step|stp|eprt|easm|edrw|3mf)$ {
      expires 7d;
      access_log off;
    }
  }
}
