name: community-compose-smoke

on:
  pull_request:
    paths:
      - "deploy/community/**"
      - "docker/**"
      - "app/**"
      - "requirements*.txt"
      - "deploy/scripts/**"
      - ".github/workflows/community-smoke.yml"
  push:
    branches: ["main", "master"]
    paths:
      - "deploy/community/**"
      - "docker/**"
      - "app/**"
      - "requirements*.txt"
      - "deploy/scripts/**"
      - ".github/workflows/community-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-install-backup-restore:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the same app Dockerfile used by releases
        run: docker build -f docker/app/Dockerfile -t tinymrp-community-ci:v0.0.0-ci .

      - name: Install from a clean Community package
        env:
          TINYMRP_NON_INTERACTIVE: "1"
          TINYMRP_DELIVERABLES_PATH: ${{ runner.temp }}/tinymrp-community/deliverables
          TINYMRP_ACCESS_MODE: localhost
          TINYMRP_APP_PORT: "5088"
          TINYMRP_ADMIN_EMAIL: community-ci@example.com
          TINYMRP_IMAGE_REPOSITORY: tinymrp-community-ci
          TINYMRP_VERSION: v0.0.0-ci
          TINYMRP_INSTALL_PULL: missing
        run: |
          set -euo pipefail
          cleanup() {
            status=$?
            trap - EXIT
            if [[ -f deploy/community/.env && "$status" -ne 0 ]]; then
              docker compose --env-file deploy/community/.env -f deploy/community/compose.yaml --profile domain ps || true
              docker compose --env-file deploy/community/.env -f deploy/community/compose.yaml --profile domain logs --no-color app mongo redis || true
            fi
            if [[ -f deploy/community/.env ]]; then
              docker compose --env-file deploy/community/.env -f deploy/community/compose.yaml --profile domain down -v --remove-orphans || true
            fi
            exit "$status"
          }
          trap cleanup EXIT

          TINYMRP_ADMIN_PASSWORD="$(openssl rand -hex 24)"
          export TINYMRP_ADMIN_PASSWORD
          mkdir -p "$TINYMRP_DELIVERABLES_PATH"
          ./deploy/community/install.sh
          grep -Fx 'TINYMRP_SEED_ADMIN="false"' deploy/community/.env
          grep -Fx 'TINYMRP_ADMIN_PASSWORD=""' deploy/community/.env
          if grep -Fq "$TINYMRP_ADMIN_PASSWORD" deploy/community/.env; then
            echo "::error::Bootstrap password remains in persistent configuration."
            exit 1
          fi

          COMPOSE=(docker compose --env-file deploy/community/.env -f deploy/community/compose.yaml)
          curl --fail --silent --show-error http://127.0.0.1:5088/api/ready | python -m json.tool

          if "${COMPOSE[@]}" exec -T mongo mongosh --quiet --eval \
            "db.getSiblingDB('tinymrp').getCollectionNames()"; then
            echo "::error::Unauthenticated Mongo access unexpectedly succeeded."
            exit 1
          fi
          roles="$("${COMPOSE[@]}" exec -T mongo mongosh --quiet \
            --username tinymrp_root --password "$(sed -n 's/^MONGO_ROOT_PASSWORD="\(.*\)"/\1/p' deploy/community/.env)" \
            --authenticationDatabase admin \
            --eval "JSON.stringify(db.getSiblingDB('tinymrp').getUser('tinymrp_app').roles)")"
          grep -Fq '"role":"readWrite","db":"tinymrp"' <<<"$roles"

          app_container="$("${COMPOSE[@]}" ps -q app)"
          test "$(docker inspect --format '{{.HostConfig.ReadonlyRootfs}}' "$app_container")" = true
          docker inspect --format '{{json .HostConfig.CapDrop}}' "$app_container" | grep -Fq 'ALL'
          docker inspect --format '{{json .HostConfig.SecurityOpt}}' "$app_container" | grep -Fq 'no-new-privileges:true'
          test -z "$(docker port "$("${COMPOSE[@]}" ps -q mongo)")"
          test -z "$(docker port "$("${COMPOSE[@]}" ps -q redis)")"

          ./deploy/community/tinymrp.sh backup
          backup_dir="$(find deploy/community/backups -mindepth 1 -maxdepth 1 -type d -name '20*Z' | sort -r | head -n1)"
          test -s "$backup_dir/mongo.archive.gz"
          "${COMPOSE[@]}" exec -T app python - <<'PY'
          from app import create_app
          from app.models.part import Part
          app = create_app()
          with app.app_context():
              database = Part._get_db()
              database["community_ci_post_backup_only"].insert_one({"must_disappear": True})
              assert database["community_ci_post_backup_only"].count_documents({}) == 1
          PY
          ./deploy/community/tinymrp.sh restore "$backup_dir" --yes
          "${COMPOSE[@]}" exec -T app python - <<'PY'
          from app import create_app
          from app.models.auth import User
          from app.models.part import Part
          app = create_app()
          with app.app_context():
              database = Part._get_db()
              assert User.objects(email="community-ci@example.com").count() == 1
              assert "community_ci_post_backup_only" not in database.list_collection_names()
          PY

          ./deploy/community/tinymrp.sh uninstall
          docker volume inspect tinymrp-community_mongo_data >/dev/null
          ./deploy/community/tinymrp.sh start
          "${COMPOSE[@]}" exec -T app python - <<'PY'
          from app import create_app
          from app.models.auth import User
          app = create_app()
          with app.app_context():
              assert User.objects(email="community-ci@example.com").count() == 1
          PY

  lan-mode-plain-http:
    # The LAN access mode was the one nobody could log into: the app assumed
    # HTTPS, so it marked the session cookie Secure and told browsers to
    # upgrade every page asset to TLS. Neither shows up on localhost, because
    # browsers treat loopback as a potentially trustworthy origin and exempt it
    # from both. Only a non-loopback address reproduces it, which is why this
    # job installs against the runner's own LAN IP and drives a real login.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the app image from source
        run: docker build -f docker/app/Dockerfile -t tinymrp-lan-ci:v0.0.0-ci .

      - name: Install in LAN mode and prove a browser can hold a session
        env:
          TINYMRP_NON_INTERACTIVE: "1"
          TINYMRP_DELIVERABLES_PATH: ${{ runner.temp }}/tinymrp-lan/deliverables
          TINYMRP_ACCESS_MODE: lan
          TINYMRP_APP_PORT: "5089"
          TINYMRP_ADMIN_EMAIL: lan-ci@example.com
          TINYMRP_IMAGE_REPOSITORY: tinymrp-lan-ci
          TINYMRP_VERSION: v0.0.0-ci
          TINYMRP_INSTALL_PULL: missing
        run: |
          set -euo pipefail
          cleanup() {
            status=$?
            trap - EXIT
            if [[ -f deploy/community/.env ]]; then
              if [[ "$status" -ne 0 ]]; then
                docker compose --env-file deploy/community/.env -f deploy/community/compose.yaml logs --no-color app || true
              fi
              docker compose --env-file deploy/community/.env -f deploy/community/compose.yaml down -v --remove-orphans || true
            fi
            exit "$status"
          }
          trap cleanup EXIT

          LAN_IP="$(hostname -I | awk '{print $1}')"
          [[ "$LAN_IP" != 127.* ]] || { echo "::error::no non-loopback address to test with"; exit 1; }
          export TINYMRP_LAN_HOST="$LAN_IP"
          BASE="http://${LAN_IP}:5089"
          echo "Testing against $BASE"

          TINYMRP_ADMIN_PASSWORD="$(openssl rand -hex 24)"
          export TINYMRP_ADMIN_PASSWORD
          mkdir -p "$TINYMRP_DELIVERABLES_PATH"
          ./deploy/community/install.sh --with-demo-data

          # The installer must have declared the plain-HTTP address, and the
          # value must reach the container - a value that stops at .env leaves
          # the app assuming HTTPS.
          grep -Fx "TINYMRP_URL=\"${BASE}\"" deploy/community/.env
          grep -Fx 'TINYMRP_TRUSTED_PROXY_HOPS="0"' deploy/community/.env
          COMPOSE=(docker compose --env-file deploy/community/.env -f deploy/community/compose.yaml)
          "${COMPOSE[@]}" exec -T app printenv TINYMRP_URL | grep -Fx "$BASE"

          curl --fail --silent --show-error "$BASE/api/ready" | python -m json.tool

          # A `Secure` cookie is discarded by a browser on a plain-HTTP origin,
          # so the session - and the CSRF token travelling in it - never
          # survives to the login POST.
          headers="$(curl --fail --silent --show-error --dump-header - --output /dev/null "$BASE/login")"
          if grep -i '^set-cookie:' <<<"$headers" | grep -qi 'secure'; then
            echo "::error::plain-HTTP LAN deployment issued a Secure session cookie"
            exit 1
          fi
          # upgrade-insecure-requests rewrites every asset URL to https:// on a
          # port that speaks HTTP, so the page renders with nothing loaded.
          if grep -i '^content-security-policy:' <<<"$headers" | grep -q 'upgrade-insecure-requests'; then
            echo "::error::plain-HTTP LAN deployment asked browsers to upgrade subresources"
            exit 1
          fi

          # End to end: fetch the form, post the credentials with the cookie
          # jar a browser would keep, and reach an authenticated page.
          jar="$(mktemp)"
          token="$(curl --fail --silent --show-error --cookie-jar "$jar" "$BASE/login" \
            | grep -oP 'name="csrf_token"[^>]*value="\K[^"]+' | head -n1)"
          [[ -n "$token" ]] || { echo "::error::no CSRF token in the login form"; exit 1; }
          code="$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --cookie "$jar" --cookie-jar "$jar" \
            --header "Referer: $BASE/login" \
            --data-urlencode "email=$TINYMRP_ADMIN_EMAIL" \
            --data-urlencode "password=$TINYMRP_ADMIN_PASSWORD" \
            --data-urlencode "csrf_token=$token" \
            "$BASE/login")"
          [[ "$code" == "302" ]] || { echo "::error::login returned $code, expected a 302 redirect"; exit 1; }
          code="$(curl --silent --output /dev/null --write-out '%{http_code}' --cookie "$jar" "$BASE/app")"
          [[ "$code" == "200" ]] || { echo "::error::authenticated page returned $code; the session did not persist"; exit 1; }

          # The demo dataset must be usable straight after a fresh install.
          "${COMPOSE[@]}" exec -T app python - <<'PY'
          from app import create_app
          from app.models.auth import User
          from app.models.part import Part
          app = create_app()
          with app.app_context():
              assert User.objects(email__endswith="@demo.com").count() > 0, "no demo logins"
              assert Part.objects(part_number="CV03-TR-A01").first() is not None, "sample part missing"
          PY

          echo "LAN mode verified end to end at $BASE"
