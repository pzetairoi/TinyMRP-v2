name: security-and-ci

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
      - name: Ruff
        run: ruff check .
      - name: Black (non-blocking — repo-wide reformat pending; see plan Phase 0 burn-down)
        continue-on-error: true
        run: black --check .
      - name: Mypy
        run: mypy app/services/security_mode.py app/services/api_auth.py
      - name: Bandit
        run: bandit -r app -ll
      - name: Pytest (with coverage)
        run: pytest -q --cov=app --cov-report=term --cov-report=xml --cov-fail-under=55
      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install runtime deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pip-audit cyclonedx-bom
      - name: pip-audit (runtime dependencies)
        run: pip-audit -r requirements.txt
      - name: SBOM (backend, CycloneDX)
        run: cyclonedx-py requirements requirements.txt --of JSON -o sbom-backend.cdx.json
      - name: Upload SBOM
        uses: actions/upload-artifact@v7
        with:
          name: sbom-backend
          path: sbom-backend.cdx.json

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: ShellCheck deploy scripts
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q shellcheck
          # Informational at first; tighten to blocking once findings are burned down.
          shellcheck -S error deploy/scripts/*.sh deploy/scripts/lib/*.sh docker/app/entrypoint.sh

  hadolint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: docker/app/Dockerfile
          # DL3008: apt packages intentionally unpinned (slim base, Dependabot watches the base tag)
          ignore: DL3008

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install deps
        run: npm ci
      - name: Audit
        run: npm audit --omit=dev --audit-level=high
      - name: Build
        run: npm run build

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: gitleaks/gitleaks-action@v3
        with:
          config-path: .gitleaks.toml
