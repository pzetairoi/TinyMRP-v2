name: security-and-ci

on:
  push:
    branches: ["main", "master"]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.15"
          cache: "pip"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip==26.2
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
      - name: Ruff
        run: ruff check .
      - name: Black (non-blocking — repo-wide reformat pending; see plan Phase 0 burn-down)
        continue-on-error: true
        run: black --check .
      - name: Mypy
        run: mypy app/services/security_mode.py app/services/api_auth.py
      - name: Bandit
        run: bandit -r app -ll
      - name: Pytest (with coverage)
        run: pytest -q --cov=app --cov-report=term --cov-report=xml --cov-fail-under=55
      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-xml
          path: coverage.xml

  fresh-compose:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fresh database, bootstrap, restart, login and API smoke
        env:
          COMPOSE_PROJECT_NAME: tinymrp-phase3a-smoke
          SMOKE_EMAIL: phase3a-smoke@example.com
          HTTP_PORT: "5080"
        run: |
          set -euo pipefail
          SMOKE_ROOT="$RUNNER_TEMP/tinymrp-phase3a-smoke"
          DELIVERABLES_DIR="$SMOKE_ROOT/deliverables"
          SMOKE_ENV="$SMOKE_ROOT/compose.env"
          SMOKE_PASSWORD="$(openssl rand -hex 24)"
          mkdir -p "$DELIVERABLES_DIR"
          cat >"$SMOKE_ENV" <<EOF
          HTTP_PORT=$HTTP_PORT
          DELIVERABLES_DIR=$DELIVERABLES_DIR
          SECRET_KEY=$(openssl rand -hex 32)
          SECURITY_PASSWORD_SALT=$(openssl rand -hex 32)
          TINYMRP_SECURITY_MODE=compat
          TINYMRP_ALLOWED_ORIGINS=http://localhost:$HTTP_PORT
          TINYMRP_CORS_CREDENTIALS=true
          TINYMRP_SEED_ADMIN=true
          TINYMRP_ADMIN_EMAIL=$SMOKE_EMAIL
          TINYMRP_ADMIN_PASSWORD=$SMOKE_PASSWORD
          FILES_ACCEL_REDIRECT_PREFIX=
          FILES_UPSTREAM_ALLOWED_HOSTS=
          FILES_PROXY_MAX_BYTES=
          EOF

          COMPOSE=(docker compose --project-name "$COMPOSE_PROJECT_NAME" --env-file "$SMOKE_ENV" -f docker-compose.yml)
          cleanup() {
            status=$?
            trap - EXIT
            if [ "$status" -ne 0 ]; then
              "${COMPOSE[@]}" ps || true
              "${COMPOSE[@]}" logs --no-color app mongo nginx || true
            fi
            "${COMPOSE[@]}" down -v --remove-orphans || true
            exit "$status"
          }
          trap cleanup EXIT

          "${COMPOSE[@]}" config --quiet
          "${COMPOSE[@]}" up -d --build --wait
          "${COMPOSE[@]}" exec -T mongo mongosh --quiet --eval \
            "if (db.adminCommand('ping').ok !== 1) { quit(1) }"

          TOKEN="$(
            "${COMPOSE[@]}" exec -T app python - <<'PY' | tail -n 1
          from app import create_app
          from app.models.auth import Role, User
          from app.services.api_tokens import create_token
          from app.services.standard_roles import STANDARD_ROLE_SLUGS

          app = create_app()
          with app.app_context():
              assert set(Role.objects.scalar("name")) == set(STANDARD_ROLE_SLUGS)
              assert Role.objects.count() == len(STANDARD_ROLE_SLUGS)
              user = User.objects.get(email="phase3a-smoke@example.com")
              assert user.active is True
              assert [role.name for role in user.roles] == ["administrator"]
              _, raw_token = create_token(user, label="phase3a-compose-smoke")
              print(raw_token)
          PY
          )"
          test -n "$TOKEN"
          export TINYMRP_SMOKE_PASSWORD="$SMOKE_PASSWORD"
          export TINYMRP_SMOKE_TOKEN="$TOKEN"
          python scripts/smoke_fresh_compose.py \
            --base-url "http://localhost:$HTTP_PORT" --email "$SMOKE_EMAIL"

          SNAPSHOT_BEFORE="$(
            "${COMPOSE[@]}" exec -T app python - <<'PY' | tail -n 1
          import json
          from app import create_app
          from app.models.auth import Role, User

          app = create_app()
          with app.app_context():
              user = User.objects.get(email="phase3a-smoke@example.com")
              print(json.dumps({
                  "password": user.password,
                  "roles": [role.name for role in user.roles],
                  "role_count": Role.objects.count(),
                  "user_count": User.objects.count(),
              }, sort_keys=True))
          PY
          )"
          "${COMPOSE[@]}" restart app
          "${COMPOSE[@]}" up -d --wait app
          SNAPSHOT_AFTER="$(
            "${COMPOSE[@]}" exec -T app python - <<'PY' | tail -n 1
          import json
          from app import create_app
          from app.models.auth import Role, User

          app = create_app()
          with app.app_context():
              user = User.objects.get(email="phase3a-smoke@example.com")
              print(json.dumps({
                  "password": user.password,
                  "roles": [role.name for role in user.roles],
                  "role_count": Role.objects.count(),
                  "user_count": User.objects.count(),
              }, sort_keys=True))
          PY
          )"
          test "$SNAPSHOT_BEFORE" = "$SNAPSHOT_AFTER"

          set +e
          BAD_OUTPUT="$("${COMPOSE[@]}" run --rm --no-deps \
            -e MONGO_URI=mongodb://mongo:27017/tinymrp-phase3a-invalid \
            -e MONGO_WAIT_RETRIES=1 \
            -e TINYMRP_SEED_ADMIN=true \
            -e TINYMRP_ADMIN_EMAIL=invalid-bootstrap@example.com \
            -e TINYMRP_ADMIN_PASSWORD= app true 2>&1)"
          BAD_STATUS=$?
          set -e
          test "$BAD_STATUS" -ne 0
          if grep -Fq "[entrypoint] Launching:" <<<"$BAD_OUTPUT"; then
            echo "Invalid bootstrap incorrectly launched the application."
            exit 1
          fi
          if "${COMPOSE[@]}" logs --no-color app | grep -Fq -- "$SMOKE_PASSWORD"; then
            echo "Bootstrap password was exposed in container logs."
            exit 1
          fi

  supply-chain:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.15"
          cache: "pip"
      - name: Install runtime deps
        run: |
          python -m pip install --upgrade pip==26.2
          pip install -r requirements-dev.txt
      - name: pip-audit (runtime dependencies)
        id: pip_audit
        run: |
          set +e
          pip-audit -r requirements.txt --format json --output pip-audit.json
          audit_status=$?
          set -e
          python -m json.tool pip-audit.json >/dev/null
          echo "exit_code=$audit_status" >>"$GITHUB_OUTPUT"
      - name: SBOM (backend, CycloneDX)
        run: cyclonedx-py requirements requirements.txt --of JSON -o sbom-backend.cdx.json
      - name: Upload backend supply-chain evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-supply-chain
          path: |
            pip-audit.json
            sbom-backend.cdx.json
          if-no-files-found: error
          retention-days: 30
      - name: Enforce Python dependency gate
        if: always() && steps.pip_audit.outputs.exit_code != '0'
        run: |
          echo "pip-audit found a vulnerability or failed; inspect backend-supply-chain."
          exit 1

  shellcheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: ShellCheck deploy scripts
        run: |
          # Error-severity findings are a blocking deployment-script gate.
          docker run --rm -v "$PWD:/mnt:ro" -w /mnt \
            koalaman/shellcheck:v0.11.0@sha256:61862eba1fcf09a484ebcc6feea46f1782532571a34ed51fedf90dd25f925a8d \
            -S error deploy/scripts/*.sh deploy/scripts/lib/*.sh docker/app/entrypoint.sh

  hadolint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with:
          dockerfile: docker/app/Dockerfile

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24.18.1"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install deps
        run: npm ci
      - name: Audit
        id: npm_audit
        run: |
          set +e
          npm audit --omit=dev --audit-level=high --json > npm-audit.json
          audit_status=$?
          set -e
          node -e "JSON.parse(require('fs').readFileSync('npm-audit.json', 'utf8'))"
          echo "exit_code=$audit_status" >>"$GITHUB_OUTPUT"
      - name: SBOM (frontend, CycloneDX)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          file: ./frontend/package-lock.json
          format: cyclonedx-json
          output-file: frontend/sbom-frontend.cdx.json
          syft-version: v1.50.0
          upload-artifact: false
          upload-release-assets: false
      - name: Build
        run: npm run build
      - name: Upload frontend supply-chain evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-supply-chain
          path: |
            frontend/npm-audit.json
            frontend/sbom-frontend.cdx.json
          if-no-files-found: error
          retention-days: 30
      - name: Enforce frontend dependency gate
        if: always() && steps.npm_audit.outputs.exit_code != '0'
        run: |
          echo "npm audit found a vulnerability or failed; inspect frontend-supply-chain."
          exit 1

  gitleaks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        with:
          config-path: .gitleaks.toml
