name: release-image

# Builds, scans, and publishes the TinyMRP app image to GHCR when a version
# tag (v*) is pushed. The trivy scan is a gate: HIGH/CRITICAL vulnerabilities
# block the push. An SBOM is generated and attached to the workflow run.
#
# Hosts can then deploy the published image instead of building from source:
#   sudo ./deploy/scripts/update-instance.sh <name> --image ghcr.io/<owner>/tinymrp-app:v2.1.0

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-scan-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/tinymrp-app
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - name: Build image (local, for scanning)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/app/Dockerfile
          load: true
          tags: tinymrp-app:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy scan (gate — HIGH/CRITICAL block the release)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: tinymrp-app:scan
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      - name: Generate SBOM (CycloneDX)
        uses: anchore/sbom-action@v0
        with:
          image: tinymrp-app:scan
          format: cyclonedx-json
          output-file: sbom-image.cdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-image
          path: sbom-image.cdx.json

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/app/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
