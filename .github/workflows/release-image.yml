name: release-image

# Builds, scans, and publishes the TinyMRP app image to GHCR when a version
# tag (v*) is pushed. The trivy scan is a gate: HIGH/CRITICAL vulnerabilities
# block the push. An SBOM is generated and attached to the workflow run.
#
# Hosts can then deploy the published image instead of building from source:
#   sudo ./deploy/scripts/update-instance.sh <name> --image ghcr.io/<owner>/tinymrp-app:v2.1.0

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-scan-push:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/tinymrp-app
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - name: Build image (local, for scanning)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/app/Dockerfile
          load: true
          tags: tinymrp-app:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy scan (HIGH/CRITICAL evidence)
        id: trivy_scan
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: tinymrp-app:scan
          version: v0.72.0
          format: json
          output: trivy-image.json
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      - name: Generate SBOM (CycloneDX)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: tinymrp-app:scan
          format: cyclonedx-json
          output-file: sbom-image.cdx.json
          syft-version: v1.50.0

      - name: Upload image supply-chain evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-supply-chain
          path: |
            trivy-image.json
            sbom-image.cdx.json
          if-no-files-found: error
          retention-days: 30

      - name: Enforce image vulnerability gate
        if: steps.trivy_scan.outcome != 'success'
        run: |
          echo "Trivy found a HIGH/CRITICAL vulnerability or failed; inspect image-supply-chain."
          exit 1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/app/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
