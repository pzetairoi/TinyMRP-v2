# TinyMRP single-host compose (Phase 2 hardened).
#
# Mongo authentication (recommended; OPT-IN so existing volumes keep working):
#   1. Fresh install: set MONGO_ROOT_USER / MONGO_ROOT_PASSWORD in .env BEFORE first
#      start and point MONGO_URI at mongodb://<user>:<pass>@mongo:27017/<db>?authSource=admin
#   2. Existing data volume: see docs/UPDATING_PRODUCTION.md ("Enabling Mongo auth
#      on an existing instance") — users must be created before enabling auth.
#
# Admin seeding is off by default. A fresh database starts only when an opted-in
# seed supplies both TINYMRP_ADMIN_EMAIL and TINYMRP_ADMIN_PASSWORD explicitly.
# The guided VPS and one-folder helpers generate those credentials operator-side.

services:
  mongo:
    image: ${TINYMRP_MONGO_IMAGE:-mongo:6.0@sha256:8b6d8f5bbedb25cb73517b65cf99f13aeb75ad5b157a56c479287a840bbad3ac}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_DB:-tinymrp-v2}
      # Empty values leave authentication disabled (backward compatible).
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-}
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      FLASK_ENV: production
      SECRET_KEY: ${SECRET_KEY}
      SECURITY_PASSWORD_SALT: ${SECURITY_PASSWORD_SALT}
      TINYMRP_SECURITY_MODE: ${TINYMRP_SECURITY_MODE:-strict}
      TINYMRP_ALLOWED_ORIGINS: ${TINYMRP_ALLOWED_ORIGINS}
      TINYMRP_CORS_CREDENTIALS: ${TINYMRP_CORS_CREDENTIALS}
      API_TOKEN_DEFAULT_TTL_DAYS: ${API_TOKEN_DEFAULT_TTL_DAYS:-90}
      API_TOKEN_MAX_TTL_DAYS: ${API_TOKEN_MAX_TTL_DAYS:-365}
      MONGO_URI: ${MONGO_URI:-mongodb://mongo:27017/${MONGO_DB:-tinymrp-v2}}
      # Unified files configuration
      FILES_LOCAL_ROOT: /data/deliverables
      FILES_URL_PREFIX: ${FILES_URL_PREFIX:-/deliverables}
      FILES_PUBLIC_URLS: ${FILES_PUBLIC_URLS:-false}
      FILES_TOKEN_TTL_SECONDS: ${FILES_TOKEN_TTL_SECONDS:-86400}
      FILES_ALLOW_LEGACY_TOKENS: ${FILES_ALLOW_LEGACY_TOKENS:-false}
      # Leave accel redirect empty unless you intentionally provision and test
      # an Nginx internal route that matches the chosen prefix.
      FILES_ACCEL_REDIRECT_PREFIX: "${FILES_ACCEL_REDIRECT_PREFIX:-}"
      FILES_UPSTREAM_ALLOWED_HOSTS: ${FILES_UPSTREAM_ALLOWED_HOSTS}
      FILES_PROXY_MAX_BYTES: ${FILES_PROXY_MAX_BYTES}
      # Rate limiting / logging (Phase 1)
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_LOGIN: ${RATE_LIMIT_LOGIN:-}
      RATE_LIMIT_API: ${RATE_LIMIT_API:-}
      RATE_LIMIT_STORAGE_URI: ${RATE_LIMIT_STORAGE_URI:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-text}
      # Admin seeding — NO default credentials (see header note).
      TINYMRP_SEED_ADMIN: ${TINYMRP_SEED_ADMIN:-false}
      TINYMRP_ADMIN_EMAIL: ${TINYMRP_ADMIN_EMAIL:-}
      TINYMRP_ADMIN_PASSWORD: ${TINYMRP_ADMIN_PASSWORD:-}
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      # Mounted read-write: the app generates thumbnails under <root>/thumbs
      # and stores extra files under <root>/extra.
      - type: bind
        source: ${DELIVERABLES_DIR}
        target: /data/deliverables
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=4).read()"]
      interval: 15s
      timeout: 5s
      retries: 10

  nginx:
    image: ${TINYMRP_NGINX_IMAGE:-nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "${HTTP_PORT:-5000}:80"
    depends_on:
      app:
        condition: service_healthy
    volumes:
      # NGINX config
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # Serve deliverables directly from NGINX too
      - type: bind
        source: ${DELIVERABLES_DIR}
        target: /data/deliverables
        read_only: true

volumes:
  mongo_data:
