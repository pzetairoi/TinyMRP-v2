version: "3.9"

services:
  mongo:
    image: mongo:6.0
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_DB:-tinymrp-v2}
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # These defaults are safe—your .env can override anything
      FLASK_ENV: production
      SECRET_KEY: ${SECRET_KEY:-change-me}
      MONGO_URI: ${MONGO_URI:-mongodb://mongo:27017/${MONGO_DB:-tinymrp-v2}}
      # Your code reads FILE_ROOTS / FILE_ROOTS_JSON; we set both.
      FILE_ROOTS: ${FILE_ROOTS:-{"local":"/data/deliverables","http":"/Deliverables"}}
      FILE_ROOTS_JSON: ${FILE_ROOTS_JSON:-{"local":"/data/deliverables","http":"/Deliverables"}}
      # Vite manifest path (your app already looks here)
      VITE_MANIFEST: /app/app/static/parts-ui/.vite/manifest.json
    depends_on:
      - mongo
    volumes:
      # Mount the host deliverables directory read-only inside the app at /data/deliverables
      - type: bind
        source: ${DELIVERABLES_DIR}
        target: /data/deliverables
        read_only: true
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5000/"]
      interval: 15s
      timeout: 5s
      retries: 10

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-5000}:80"
    depends_on:
      - app
    volumes:
      # NGINX config
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # Serve Deliverables directly from NGINX too
      - type: bind
        source: ${DELIVERABLES_DIR}
        target: /data/deliverables
        read_only: true

volumes:
  mongo_data:
