version: "3.9"

services:
  mongo:
    image: mongo:6.0
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_DB:-tinymrp-v2}
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    restart: unless-stopped
    environment:
      # These defaults are safe–your .env can override anything
      FLASK_ENV: production
      SECRET_KEY: ${SECRET_KEY}
      SECURITY_PASSWORD_SALT: ${SECURITY_PASSWORD_SALT}
      TINYMRP_SECURITY_MODE: ${TINYMRP_SECURITY_MODE:-compat}
      TINYMRP_ALLOWED_ORIGINS: ${TINYMRP_ALLOWED_ORIGINS}
      TINYMRP_CORS_CREDENTIALS: ${TINYMRP_CORS_CREDENTIALS}
      MONGO_URI: ${MONGO_URI:-mongodb://mongo:27017/${MONGO_DB:-tinymrp-v2}}
      # Unified files configuration
      FILES_LOCAL_ROOT: /data/deliverables
      FILES_URL_PREFIX: ${FILES_URL_PREFIX:-/deliverables}
      FILES_PUBLIC_URLS: ${FILES_PUBLIC_URLS:-false}
      FILES_ACCEL_REDIRECT_PREFIX: ${FILES_ACCEL_REDIRECT_PREFIX:-/__files}
      # Optional: enable HTTP proxy to an external file server
      # FILES_UPSTREAM_BASE: ${FILES_UPSTREAM_BASE}
      FILES_UPSTREAM_ALLOWED_HOSTS: ${FILES_UPSTREAM_ALLOWED_HOSTS}
      FILES_PROXY_MAX_BYTES: ${FILES_PROXY_MAX_BYTES}
      DELIVERABLES_DIR: Z:/
      # Optional admin seeding (compat mode only)
      TINYMRP_SEED_ADMIN: ${TINYMRP_SEED_ADMIN:-false}
      TINYMRP_ADMIN_EMAIL: ${TINYMRP_ADMIN_EMAIL}
      TINYMRP_ADMIN_PASSWORD: ${TINYMRP_ADMIN_PASSWORD}
    depends_on:
      - mongo
    volumes:
      # Mount the host deliverables directory read-only inside the app at /data/deliverables
      - type: bind
        source: ${DELIVERABLES_DIR}
        target: /data/deliverables
        # Must be writable so the app can generate thumbnails under /data/deliverables/thumbs
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/"]
      interval: 15s
      timeout: 5s
      retries: 10

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-5000}:80"
    depends_on:
      - app
    volumes:
      # NGINX config
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # Serve deliverables directly from NGINX too
      - type: bind
        source: ${DELIVERABLES_DIR}
        target: /data/deliverables
        read_only: true

volumes:
  mongo_data:
