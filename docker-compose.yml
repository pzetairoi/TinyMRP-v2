# TinyMRP single-host compose (Phase 2 hardened).
#
# Mongo authentication (recommended; OPT-IN so existing volumes keep working):
#   1. Fresh install: set MONGO_ROOT_USER / MONGO_ROOT_PASSWORD in .env BEFORE first
#      start and point MONGO_URI at mongodb://<user>:<pass>@mongo:27017/<db>?authSource=admin
#   2. Existing data volume: see docs/UPDATING_PRODUCTION.md ("Enabling Mongo auth
#      on an existing instance") — users must be created before enabling auth.
#
# Admin seeding is off by default. A fresh database starts only when an opted-in
# seed supplies both TINYMRP_ADMIN_EMAIL and TINYMRP_ADMIN_PASSWORD explicitly.
# The guided VPS and one-folder helpers generate those credentials operator-side.

services:
  mongo:
    image: ${TINYMRP_MONGO_IMAGE:-mongo:6.0@sha256:8b6d8f5bbedb25cb73517b65cf99f13aeb75ad5b157a56c479287a840bbad3ac}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_DB:-tinymrp-v2}
      # Empty values leave authentication disabled (backward compatible).
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-}
      # Scoped application user, created on FIRST boot only (OPS-DBAUTH-01).
      # The app connects as this instead of root, so a compromised application
      # credential cannot reach other databases or administer the server.
      MONGO_APP_USER: ${MONGO_APP_USER:-}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:-}
    volumes:
      - mongo_data:/data/db
      # Runs once, on an empty data directory, already authenticated as root.
      - ./docker/mongo:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # mongosh is a full Node REPL, not a light client: one invocation
      # measured at 1873 ms of CPU and five new connections. At the old 10s
      # interval that is roughly 23 seconds of CPU per minute per Mongo, on an
      # idle host - a large share of the "40% CPU while idle" the owner saw,
      # spent entirely on asking whether the database was alive.
      # 30s still notices a dead Mongo quickly enough for a healthcheck whose
      # retries then take another 90s to act.
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Shared rate-limit storage (OPS-RATE-01). Without it, Flask-Limiter keeps
  # counters in each gunicorn worker's memory, so a "10 per minute" login limit
  # is really 10-per-worker and the real budget is multiplied by the worker
  # count. Redis gives every worker one shared budget.
  #
  # Holds only ephemeral counters - no application data - so losing this volume
  # costs nothing but a reset of the current rate-limit windows.
  redis:
    image: ${TINYMRP_REDIS_IMAGE:-redis:7-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2}
    restart: unless-stopped
    read_only: true
    # Run as redis directly. The official entrypoint chowns /data when it
    # starts as root, and cap_drop: ALL removes CAP_CHOWN - so the container
    # crash-looped on "chown: Operation not permitted". Starting as the target
    # user skips that step entirely. Found on a real deployment; no amount of
    # config review would have shown it.
    user: redis
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Not published to the host: only the app needs to reach it.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    tmpfs:
      - /tmp
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      FLASK_ENV: production
      SECRET_KEY: ${SECRET_KEY}
      SECURITY_PASSWORD_SALT: ${SECURITY_PASSWORD_SALT}
      # The address browsers use. Its scheme decides whether session cookies
      # are marked Secure and whether the CSP upgrades subresources to https —
      # both of which break a plain-HTTP deployment if assumed wrongly.
      TINYMRP_URL: ${TINYMRP_URL:-}
      TINYMRP_BROWSER_TLS: ${TINYMRP_BROWSER_TLS:-auto}
      # nginx below is the one proxy in front of the app.
      TINYMRP_TRUSTED_PROXY_HOPS: ${TINYMRP_TRUSTED_PROXY_HOPS:-1}
      TINYMRP_ALLOWED_ORIGINS: ${TINYMRP_ALLOWED_ORIGINS}
      TINYMRP_CORS_CREDENTIALS: ${TINYMRP_CORS_CREDENTIALS}
      API_TOKEN_DEFAULT_TTL_DAYS: ${API_TOKEN_DEFAULT_TTL_DAYS:-90}
      API_TOKEN_MAX_TTL_DAYS: ${API_TOKEN_MAX_TTL_DAYS:-365}
      MONGO_URI: ${MONGO_URI:-mongodb://mongo:27017/${MONGO_DB:-tinymrp-v2}}
      # Unified files configuration
      FILES_LOCAL_ROOT: /data/deliverables
      FILES_URL_PREFIX: ${FILES_URL_PREFIX:-/deliverables}
      FILES_PUBLIC_URLS: ${FILES_PUBLIC_URLS:-false}
      FILES_TOKEN_TTL_SECONDS: ${FILES_TOKEN_TTL_SECONDS:-86400}
      FILES_ALLOW_LEGACY_TOKENS: ${FILES_ALLOW_LEGACY_TOKENS:-false}
      # Leave accel redirect empty unless you intentionally provision and test
      # an Nginx internal route that matches the chosen prefix.
      FILES_ACCEL_REDIRECT_PREFIX: "${FILES_ACCEL_REDIRECT_PREFIX:-}"
      FILES_UPSTREAM_ALLOWED_HOSTS: ${FILES_UPSTREAM_ALLOWED_HOSTS}
      FILES_PROXY_MAX_BYTES: ${FILES_PROXY_MAX_BYTES}
      # Rate limiting / logging (Phase 1)
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_LOGIN: ${RATE_LIMIT_LOGIN:-}
      RATE_LIMIT_API: ${RATE_LIMIT_API:-}
      # Defaults to the bundled redis service so limits are shared across
      # gunicorn workers (OPS-RATE-01). Set RATE_LIMIT_STORAGE_URI=memory:// to
      # opt out, or point it at an external Redis.
      RATE_LIMIT_STORAGE_URI: ${RATE_LIMIT_STORAGE_URI:-redis://redis:6379/0}
      # Storage outage policy. Default fail-OPEN: losing rate limiting is far
      # better than refusing all traffic. Set true to reject instead.
      RATE_LIMIT_FAIL_CLOSED: ${RATE_LIMIT_FAIL_CLOSED:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-text}
      # Admin seeding — NO default credentials (see header note).
      TINYMRP_SEED_ADMIN: ${TINYMRP_SEED_ADMIN:-false}
      TINYMRP_ADMIN_EMAIL: ${TINYMRP_ADMIN_EMAIL:-}
      TINYMRP_ADMIN_PASSWORD: ${TINYMRP_ADMIN_PASSWORD:-}
    depends_on:
      mongo:
        condition: service_healthy
      # service_started, not service_healthy: rate limiting degrades to
      # fail-open if Redis is unavailable, so waiting on its health would delay
      # startup for a non-critical dependency.
      redis:
        condition: service_started
    volumes:
      # Mounted read-write: the app generates thumbnails under <root>/thumbs
      # and stores extra files under <root>/extra.
      - type: bind
        source: ${DELIVERABLES_DIR}
        target: /data/deliverables
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/ready', timeout=4).read()"]
      interval: 15s
      timeout: 5s
      retries: 10

  nginx:
    image: ${TINYMRP_NGINX_IMAGE:-nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "${HTTP_PORT:-5000}:80"
    depends_on:
      app:
        condition: service_healthy
    volumes:
      # NGINX config
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # Serve deliverables directly from NGINX too
      - type: bind
        source: ${DELIVERABLES_DIR}
        target: /data/deliverables
        read_only: true

volumes:
  mongo_data:
  redis_data:
