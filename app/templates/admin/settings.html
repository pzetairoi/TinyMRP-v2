{% extends "security/base.html" %}
{% block title %}Admin Settings{% endblock %}
{% block content %}
<div class="container my-4">
  <h1 class="h4 mb-4">Admin Settings</h1>
  <form method="post" enctype="multipart/form-data">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <div class="card shadow-sm mb-3">
      <div class="card-body">
        <h5 class="card-title">Branding</h5>
        <p class="text-muted small">Upload a PNG or SVG logo used across the app and doc packs.</p>
        <div class="mb-2">
          <img src="{{ url_for('branding.logo') }}" alt="Brand logo" style="max-height:64px;max-width:180px;">
        </div>
        <div class="mb-3">
          <input class="form-control form-control-sm" type="file" name="brand_logo" accept="image/png,image/svg+xml">
        </div>
        <div class="form-check">
          <input class="form-check-input" type="checkbox" id="removeLogo" name="remove_logo" value="on">
          <label class="form-check-label" for="removeLogo">Remove custom logo (revert to default)</label>
        </div>
      </div>
    </div>

    <div class="card shadow-sm mb-3">
      <div class="card-body">
        <h5 class="card-title">Timezone</h5>
        <p class="text-muted small">Used for docpack timestamps and report headers.</p>
        <input
          class="form-control form-control-sm"
          type="text"
          name="timezone"
          list="tzlist"
          placeholder="Australia/Melbourne"
          value="{{ settings.timezone or '' }}"
        >
        <datalist id="tzlist">
          <option value="UTC"></option>
          <option value="Australia/Melbourne"></option>
          <option value="Australia/Sydney"></option>
          <option value="Australia/Perth"></option>
          <option value="America/New_York"></option>
          <option value="America/Los_Angeles"></option>
          <option value="Europe/London"></option>
        </datalist>
      </div>
    </div>

    <button class="btn btn-primary" type="submit">Save settings</button>
  </form>
</div>
{% endblock %}
