{% extends "security/base.html" %}
{% block title %}{{ 'Edit role' if role else 'New role' }} · Admin{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-8 col-lg-7">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h1 class="h5 mb-3">{{ 'Edit role' if role else 'New role' }}</h1>
        <form method="post">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <div class="mb-3">
            <label class="form-label">Name</label>
            <input class="form-control" type="text" name="name" value="{{ role.name if role else '' }}" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Description</label>
            <input class="form-control" type="text" name="description" value="{{ role.description if role else '' }}">
          </div>

          {% set selected = role.permissions if role else [] %}

          <div class="mb-3">
            <label class="form-label">Permissions</label>
            <div class="row row-cols-2 row-cols-md-3 g-2">
              {% for p in permissions %}
              <div class="col">
                <div class="form-check">
                  <input class="form-check-input" type="checkbox"
                         id="perm-{{ loop.index }}" name="permissions" value="{{ p }}"
                         {% if p in selected %}checked{% endif %}>
                  <label class="form-check-label" for="perm-{{ loop.index }}">{{ p }}</label>
                </div>
              </div>
              {% endfor %}
            </div>
          </div>

          <button class="btn btn-primary w-100" type="submit">{{ 'Save' if role else 'Create' }}</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
