{% extends "security/base.html" %}
{% block title %}Parts Browser{% endblock %}

{% block content %}
<div class="card shadow-sm">
  <div class="card-body">
    <h1 class="h5 mb-3">Parts</h1>
    <div class="table-responsive">
      <table id="partsTable" class="table table-striped table-hover w-100">
        <thead>
          <tr>
            <th>Part Number</th>
            <th>Description</th>
            <th>Category</th>
          </tr>
          <tr id="filters">
            <th><input class="form-control form-control-sm" placeholder="Search PN"></th>
            <th><input class="form-control form-control-sm" placeholder="Description"></th>
            <th>
              <!-- text filter; switch to <select> and populate via /api/parts/distinct/category if you like -->
              <input class="form-control form-control-sm" placeholder="Category">
            </th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<link href="https://cdn.datatables.net/v/bs5/dt-2.3.2/datatables.min.css" rel="stylesheet">
<script src="https://cdn.datatables.net/v/bs5/dt-2.3.2/datatables.min.js"></script>

<script>
(function(){
  // column indices match the backend "columns" list
  const COL = { pn:0, desc:1, cat:2 };

  const dt = $('#partsTable').DataTable({
    processing: true,
    serverSide: true,
    orderCellsTop: true,       // enables header filter row
    fixedHeader: true,
    searchDelay: 250,
    lengthMenu: [10, 25, 50, 100],
    order: [[COL.pn, 'asc']],
    ajax: {
      url: "{{ url_for('parts.api_parts') }}",
      type: "GET",
      data: function (d) {
        const $f = $('#filters');
        d.columns[COL.pn].search.value   = $f.find('th:eq('+COL.pn+') input').val() || '';
        d.columns[COL.desc].search.value = $f.find('th:eq('+COL.desc+') input').val() || '';
        d.columns[COL.cat].search.value  = $f.find('th:eq('+COL.cat+') input').val() || '';
      }
    },
    columnDefs: [
      // Column 0 contains an <a> tag (PN link) – allow HTML
      { targets: [0], orderable: true }
    ],
    // Optional: keep default renderers; server already escapes non-PN fields
  });

  // live filter events
  $('#filters input').on('keyup change', function(){ dt.draw(); });

  // If you prefer a dropdown for Category, uncomment and replace the input:
  // fetch("{{ url_for('parts.distinct_category') }}")
  //   .then(r=>r.json()).then(vals=>{
  //     const th = $('#filters th').eq(COL.cat);
  //     th.empty();
  //     const sel = $('<select class="form-select form-select-sm"><option value=""></option></select>');
  //     vals.forEach(v => sel.append($('<option>').val(v).text(v)));
  //     th.append(sel);
  //     sel.on('change', function(){ dt.draw(); });
  //   });
})();
</script>
{% endblock %}
