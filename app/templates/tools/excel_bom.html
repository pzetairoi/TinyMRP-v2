{% extends "security/base.html" %}
{% block title %}Excel BOM Builder{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-8 col-lg-6">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h1 class="h5 mb-3">Excel BOM Builder</h1>
        <form method="post">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <div class="mb-3">
            <label class="form-label">Part Number</label>
            <input class="form-control" type="text" name="pn" placeholder="e.g. ASM-1001" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Revision (optional)</label>
            <input class="form-control" type="text" name="rev" placeholder="e.g. A (leave blank for latest)">
          </div>
          <div class="mb-3">
            <label class="form-label">Depth</label>
            <select class="form-select" name="depth">
              <option value="full">Full BOM</option>
              <option value="top">Top-level only</option>
            </select>
          </div>
          <button class="btn btn-primary" type="submit">Build Excel</button>
          <a class="btn btn-outline-secondary" href="{{ url_for('tools.tools_index') }}">Back</a>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
