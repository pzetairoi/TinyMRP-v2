{% extends "security/base.html" %}
{% block title %}TinyMRP{% endblock %}

{% block extra_head %}
<meta name="description" content="TinyMRP">
<meta property="og:title" content="TinyMRP">
<meta property="og:description" content="TinyMRP">
<meta property="og:type" content="website">
{% endblock %}

{% block content %}
<div class="d-flex flex-column align-items-center">
  <div class="my-4">
    <img src="{{ url_for('static', filename='images/homepage_logo.svg') }}"
         alt="TinyMRP"
         usemap="#homemap"
         style="max-width:520px; width:100%; height:auto;">
    <map name="homemap">
      <area shape="poly" coords="67,390,35,345,22,285,78,295,100,342"
            href="{% if current_user.is_authenticated %}/ui/parts{% else %}{{ url_for_security('login') }}{% endif %}">
      <area shape="poly" coords="18,220,84,209,104,165,65,107,27,165"
            href="{% if current_user.is_authenticated %}{{ url_for('admin_suppliers.suppliers_list') }}{% else %}{{ url_for_security('login') }}{% endif %}">
      <area shape="poly" coords="102,63,158,34,222,19,209,87,165,104"
            href="{% if current_user.is_authenticated %}{{ url_for('admin_customers.customers_list') }}{% else %}{{ url_for_security('login') }}{% endif %}">
      <area shape="poly" coords="279,18,344,34,395,65,338,104,295,87"
            href="{% if current_user.is_authenticated %}{{ url_for('admin_jobs.jobs_list') }}{% else %}{{ url_for_security('login') }}{% endif %}">
      <area shape="poly" coords="439,107,473,165,478,220,419,210,398,162"
            href="{% if current_user.is_authenticated %}{{ url_for('admin_orders.orders_list') }}{% else %}{{ url_for_security('login') }}{% endif %}">
      <area shape="poly" coords="485,280,473,337,473,393,401,340,420,295"
            href="{% if current_user.is_authenticated %}{{ url_for('tools.tools_index') }}{% else %}{{ url_for_security('login') }}{% endif %}">
    </map>
  </div>

  <div class="d-flex flex-wrap justify-content-center gap-3 small">
    <a href="{{ url_for('main.download_addin') }}">Download SolidWorks Add-in</a>
    <a href="{{ url_for('main.download_macro') }}">Download Macro</a>
  </div>

  <div class="text-center small text-muted mt-2">
    <div>Copyright (c) 2024 TinyMRP Ltd.</div>
    <div>Contact: <a href="mailto:admin@tinymrp.com">admin@tinymrp.com</a></div>
  </div>
</div>
{% endblock %}
